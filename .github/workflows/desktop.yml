name: Desktop applications
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  build:
    name: ${{ matrix.platform }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macOS-arm64
          - os: windows-2022
            platform: Windows-x86_64
          - os: ubuntu-24.04
            platform: Linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: runner.os != 'macOS'
        with:
          python-version: '3.13.2'
          architecture: x64
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: |
          curl --fail --location https://www.python.org/ftp/python/3.13.2/python-3.13.2-macos11.pkg --output "$RUNNER_TEMP/python.pkg"
          echo "6c6792b3780f21284beb2546dca2eb5893bcf5b8d91c0cf0ec1fadeb75cbedea  $RUNNER_TEMP/python.pkg" | shasum -a 256 --check
          sudo installer -pkg "$RUNNER_TEMP/python.pkg" -target /
          echo /Library/Frameworks/Python.framework/Versions/3.13/bin >> "$GITHUB_PATH"
          brew install tesseract
      - name: Install Ubuntu build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libtesseract-dev libleptonica-dev tcl8.6-dev tk8.6-dev xvfb xauth patchelf
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - uses: actions/cache@v4
        with:
          path: build/opencv/wheels
          key: opencv-${{ runner.os }}-${{ runner.arch }}-py313-${{ hashFiles('tools/build_opencv.py', 'requirements-*.txt') }}
      - uses: actions/cache@v4
        if: runner.os == 'Windows'
        with:
          path: build/vcpkg-cache
          key: ocr-static-${{ runner.os }}-${{ hashFiles('packaging/vcpkg/**', 'tools/prepare_windows_ocr.ps1') }}
      - name: Build Windows OCR
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/vcpkg-cache | Out-Null
          $env:VCPKG_BINARY_SOURCES = "clear;files,$PWD/build/vcpkg-cache,readwrite"
          ./tools/prepare_windows_ocr.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install pinned dependencies and build inputs
        shell: bash
        run: |
          python -m pip install -r requirements-build.txt
          python tools/prepare_build_inputs.py
          python tools/check_release.py --import-modules
      - name: Build and verify Mac app
        if: runner.os == 'macOS'
        run: python tools/build_desktop.py --gui-test --tessdata build/inputs/tessdata --runtime-notices build/inputs/runtime
      - name: Build and verify Windows app and installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:VCPKG_COMMIT = (Get-Content packaging/vcpkg/vcpkg.json | ConvertFrom-Json).'builtin-baseline'
          python tools/build_desktop.py --gui-test --installer --tesseract build/vcpkg_installed/x64-windows-static-md/tools/tesseract/tesseract.exe --ocr-root build/vcpkg_installed/x64-windows-static-md --tessdata build/inputs/tessdata --runtime-notices build/inputs/runtime
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build and verify Linux app
        if: runner.os == 'Linux'
        run: xvfb-run -a python tools/build_desktop.py --gui-test --tessdata build/inputs/tessdata --runtime-notices build/inputs/runtime
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: KnotStudio-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*Setup.exe
            dist/SHA256SUMS.txt
            dist/verification.json
            dist/build-info.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-${{ matrix.platform }}
          path: |
            dist/verification.json
            build/opencv/**/*.log
            build/vcpkg/buildtrees/**/*.log
          retention-days: 7
